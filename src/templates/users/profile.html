{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Mon Profil" %} | CO3DATA{% endblock %}

{% block content %}
<div class="row g-3">
    <div class="col-lg-12">
        <div class="card mb-3">
            <div class="card-header bg-light">
                <h5 class="mb-0">{% trans "Paramètres du Profil" %}</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 text-center mb-3">
                        <div class="avatar avatar-5xl mb-3">
                            <div class="avatar-name rounded-circle"><span>{{ user.username|first|upper }}</span></div>
                        </div>
                        <button class="btn btn-falcon-default btn-sm w-100">{% trans "Changer Photo" %}</button>
                    </div>
                    <div class="col-md-9">
                        <form>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label" for="username">{% trans "Nom d'utilisateur" %}</label>
                                    <input class="form-control" id="username" type="text" value="{{ user.username }}" disabled />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="email">{% trans "Email" %}</label>
                                    <input class="form-control" id="email" type="email" value="{{ user.email }}" disabled />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="first-name">{% trans "Prénom" %}</label>
                                    <input class="form-control" id="first-name" type="text" value="{{ user.first_name }}" />
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="last-name">{% trans "Nom" %}</label>
                                    <input class="form-control" id="last-name" type="text" value="{{ user.last_name }}" />
                                </div>
                                <div class="col-12 mt-3">
                                    <button class="btn btn-falcon-primary" type="submit">{% trans "Enregistrer les modifications" %}</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
